services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '7860:7860'

volumes:
  redis-data:
