<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#5B4FE0"/>
      <stop offset="100%" stop-color="#C6409E"/>
    </linearGradient>
  </defs>

  <!-- Nền app-icon, bo góc lớn kiểu iOS/macOS -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Monogram H cách điệu thành bong bóng chat -->
  <g fill="#FFFFFF">
    <!-- Nét dọc trái -->
    <rect x="17" y="16" width="8" height="31" rx="3.5"/>
    <!-- Thanh ngang -->
    <rect x="17" y="27" width="30" height="8" rx="3.5"/>
    <!-- Nét dọc phải, phần trên -->
    <path d="M39 19.5
             C39 17.6 40.6 16 42.5 16
             L43.5 16
             C45.4 16 47 17.6 47 19.5
             L47 40
             C47 40.9 46.3 41.5 45.5 41.5
             L42.5 41.5
             C40.6 41.5 39 39.9 39 38
             Z"/>
    <!-- Đuôi bong bóng chat -->
    <path d="M39 38
             C39 39.9 40.6 41.5 42.5 41.5
             L44.5 41.5
             L44.5 52
             C44.5 52.9 43.4 53.3 42.8 52.7
             L36.5 46
             Z"/>
  </g>

  <!-- Chấm trạng thái trực tuyến / real-time -->
  <circle cx="49" cy="14" r="7" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="49" cy="14" r="3.4" fill="#3DDC8C"/>
</svg>
