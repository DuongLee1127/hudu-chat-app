<svg width="520" height="500" viewBox="0 0 520 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="bubbleOut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d6bff" />
      <stop offset="100%" stop-color="#5b5bf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#f4f5ff" stop-opacity="0.98" />
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1147" flood-opacity="0.28" />
    </filter>
    <filter id="softShadowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1147" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ambient decorative blobs -->
  <circle cx="52" cy="70" r="46" fill="white" fill-opacity="0.10" />
  <circle cx="468" cy="50" r="26" fill="white" fill-opacity="0.14" />
  <circle cx="480" cy="410" r="60" fill="white" fill-opacity="0.09" />
  <circle cx="34" cy="430" r="20" fill="white" fill-opacity="0.14" />
  <circle cx="250" cy="20" r="6" fill="white" fill-opacity="0.5" />
  <circle cx="300" cy="8" r="3.5" fill="white" fill-opacity="0.6" />
  <circle cx="90" cy="470" r="4" fill="white" fill-opacity="0.5" />
  <circle cx="440" cy="470" r="5" fill="white" fill-opacity="0.4" />
  <!-- sparkle accents -->
  <path d="M74 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="white" fill-opacity="0.55" />
  <path d="M436 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="white" fill-opacity="0.5" />

  <!-- phone frame -->
  <g filter="url(#softShadow)">
    <rect x="150" y="40" width="220" height="400" rx="32" fill="url(#phoneGlow)" stroke="white" stroke-opacity="0.4" stroke-width="2" />
    <rect x="168" y="70" width="184" height="340" rx="16" fill="#f4f5fb" />
  </g>

  <!-- status bar -->
  <rect x="184" y="80" width="30" height="6" rx="3" fill="#c9cbe8" />
  <circle cx="322" cy="83" r="3" fill="#c9cbe8" />
  <circle cx="332" cy="83" r="3" fill="#c9cbe8" />
  <circle cx="342" cy="83" r="3" fill="#c9cbe8" />

  <!-- chat header -->
  <circle cx="196" cy="108" r="14" fill="url(#bubbleOut)" />
  <circle cx="203" cy="115" r="3.5" fill="#3ab795" stroke="#f4f5fb" stroke-width="1.5" />
  <rect x="218" y="99" width="72" height="8" rx="4" fill="#c9cbe8" />
  <rect x="218" y="112" width="48" height="6" rx="3" fill="#dcdeee" />
  <line x1="184" y1="132" x2="336" y2="132" stroke="#e3e4f3" stroke-width="1.5" />

  <!-- incoming bubbles with mini avatar -->
  <circle cx="192" cy="163" r="10" fill="#dcdeee" />
  <rect x="208" y="150" width="128" height="30" rx="14" fill="#e7e8fb" />
  <rect x="208" y="188" width="90" height="26" rx="13" fill="#e7e8fb" />

  <!-- outgoing bubbles -->
  <rect x="196" y="228" width="120" height="30" rx="14" fill="url(#bubbleOut)" />
  <rect x="228" y="264" width="88" height="26" rx="13" fill="url(#bubbleOut)" />

  <!-- incoming image bubble -->
  <circle cx="192" cy="322" r="10" fill="#dcdeee" />
  <rect x="208" y="304" width="72" height="56" rx="14" fill="#e7e8fb" />
  <rect x="220" y="318" width="48" height="28" rx="6" fill="#c9cbe8" />
  <circle cx="230" cy="330" r="4" fill="#f4f5fb" />
  <path d="M222 342 l10 -10 8 8 12 -14 12 18 z" fill="#f4f5fb" />

  <!-- typing indicator -->
  <rect x="208" y="372" width="64" height="28" rx="14" fill="#e7e8fb" />
  <circle cx="226" cy="386" r="3.2" fill="#9a9ab0">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0s" />
  </circle>
  <circle cx="238" cy="386" r="3.2" fill="#9a9ab0">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
  </circle>
  <circle cx="250" cy="386" r="3.2" fill="#9a9ab0">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.4s" />
  </circle>

  <!-- floating notification card top-right -->
  <g filter="url(#softShadowSm)" transform="translate(340,120)">
    <rect x="0" y="0" width="150" height="62" rx="16" fill="url(#cardGrad)" />
    <circle cx="26" cy="31" r="14" fill="#f65ba3" />
    <path d="M20 31c0-3.9 3.1-6.6 6.5-6.6 1.7 0 3.3.8 4.5 2 1.2-1.2 2.8-2 4.5-2 3.4 0 6.5 2.7 6.5 6.6 0 5.9-11 10.8-11 10.8s-11-4.9-11-10.8z" fill="white"/>
    <rect x="50" y="18" width="82" height="7" rx="3.5" fill="#c9cbe8" />
    <rect x="50" y="31" width="60" height="6" rx="3" fill="#dcdeee" />
    <rect x="50" y="42" width="40" height="6" rx="3" fill="#e7e8fb" />
  </g>

  <!-- floating chat bubble icon upper-left -->
  <g filter="url(#softShadowSm)" transform="translate(24,190)">
    <path d="M0 20C0 8.95 8.95 0 20 0H72C83.05 0 92 8.95 92 20V40C92 51.05 83.05 60 72 60H30L10 78V60H20C8.95 60 0 51.05 0 40V20Z" fill="url(#cardGrad)"/>
    <circle cx="26" cy="30" r="5" fill="#8c5bf6" />
    <circle cx="46" cy="30" r="5" fill="#8c5bf6" />
    <circle cx="66" cy="30" r="5" fill="#8c5bf6" />
  </g>

  <!-- floating like / reaction badge bottom-left -->
  <g filter="url(#softShadowSm)" transform="translate(40,330)">
    <circle cx="30" cy="30" r="30" fill="url(#cardGrad)" />
    <path d="M30 42s-14-8.4-14-19.1C16 17 20.9 12 26.4 12c2.5 0 4.9 1.1 6.6 3 1.7-1.9 4.1-3 6.6-3C45.1 12 50 17 50 22.9 50 33.6 36 42 36 42h-6z" fill="#f65ba3"/>
  </g>

  <!-- floating unread badge bottom-right -->
  <g filter="url(#softShadowSm)" transform="translate(360,330)">
    <rect x="0" y="0" width="120" height="58" rx="16" fill="url(#cardGrad)" />
    <circle cx="24" cy="29" r="13" fill="#3a8ef6" />
    <path d="M17 29l5 5 10-10" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="46" y="18" width="58" height="7" rx="3.5" fill="#c9cbe8" />
    <rect x="46" y="31" width="40" height="6" rx="3" fill="#dcdeee" />
    <circle cx="104" cy="12" r="9" fill="#f65ba3" />
    <text x="104" y="15.5" font-size="10" font-family="Arial, sans-serif" fill="white" text-anchor="middle" font-weight="700">3</text>
  </g>

  <!-- orbit ring accents -->
  <circle cx="260" cy="250" r="238" stroke="white" stroke-opacity="0.08" stroke-width="1.5" fill="none" />
</svg>
